version: "3.9"

services:
  trex-web-playground:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trex-web-playground
    ports:
      - "3000:3000"
    privileged: true
    cap_add:
      - ALL
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
